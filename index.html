<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Internal launcher for our department's AI tools." />
    <title>AI Navigation Hub</title>
    <script>
      // Applied before first paint so there is no light-mode flash on load.
      try {
        const stored = localStorage.getItem('hub-theme')
        const dark = stored ? stored === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
